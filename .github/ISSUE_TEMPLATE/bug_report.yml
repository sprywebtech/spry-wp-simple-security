name: Bug report
description: Report a reproducible problem with the plugin
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities publicly. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: WordPress, PHP, and web-server versions
      placeholder: WordPress 6.x, PHP 8.x, HestiaCP with Nginx and Apache
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
