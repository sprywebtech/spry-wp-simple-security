name: Apply 1.0.1 hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-1.0.1.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch open_basedir-safe temporary path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plugin = Path('spry-simple-wp-security.php')
          text = plugin.read_text()
          text = text.replace('Version:     1.0.0', 'Version:     1.0.1')
          text = text.replace("const VERSION          = '1.0.0';", "const VERSION          = '1.0.1';")
          text = text.replace("$temp = wp_tempnam( basename( $file ), $dir );", "$temp = wp_tempnam( basename( $file ), trailingslashit( $dir ) );")
          plugin.write_text(text)

          readme = Path('readme.txt')
          text = readme.read_text()
          text = text.replace('Stable tag: 1.0.0', 'Stable tag: 1.0.1')
          if '= 1.0.1 =' not in text:
              text = text.replace('= 1.0.0 =', '= 1.0.1 =\n* Fixed temporary file creation under open_basedir-restricted HestiaCP environments.\n\n= 1.0.0 =')
          readme.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if '## [1.0.1]' not in text:
              marker = '## [1.0.0]'
              entry = '## [1.0.1] - 2026-07-25\n\n### Fixed\n\n- Create atomic-write temporary files inside the target directory when PHP `open_basedir` restrictions are enabled.\n\n'
              text = text.replace(marker, entry + marker)
          changelog.write_text(text)
          PY
          php -l spry-simple-wp-security.php
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spry-simple-wp-security.php readme.txt CHANGELOG.md
          git diff --cached --quiet || git commit -m "Fix open_basedir temporary file path"
          git push
