name: Publish 1.0.2 release files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace release files
        shell: bash
        run: |
          cat > /tmp/release102.b64 <<'EOF'

EOF
          base64 -d /tmp/release102.b64 > /tmp/release102.tar.gz
          tar -xzf /tmp/release102.tar.gz -C "$GITHUB_WORKSPACE"
          php -l spry-simple-wp-security.php
          php -l uninstall.php
      - name: Commit release files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spry-simple-wp-security.php readme.txt CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Publish version 1.0.2"
          git push
